<!doctype html>
<html>
  <head>
    <meta charset="UTF-8" />
    <title>Vfan TV</title>
    <% if (webpackConfig.mode === 'production') { %>
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: https: http://127.0.0.1:*; connect-src 'self' https: http://127.0.0.1:*; media-src 'self' https: http://127.0.0.1:* blob:; worker-src 'self' blob:"
    />
    <% } else { %>
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self' data:; script-src 'self' 'unsafe-eval'; style-src 'self' 'unsafe-inline'; img-src 'self' data: https: http://127.0.0.1:*; connect-src 'self' ws: wss: https: http://127.0.0.1:*; media-src 'self' https: http://127.0.0.1:* blob:; worker-src 'self' blob:"
    />
    <% } %>
  </head>

  <body>
    <div id="root"></div>
  </body>
</html>
